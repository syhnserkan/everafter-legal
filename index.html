<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EverAfter Legal</title>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: #f6f7f9;
        margin: 0;
        padding: 40px 20px;
        color: #222;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #555;
        line-height: 1.6;
      }

      .links {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      a {
        display: block;
        padding: 14px 16px;
        background: #f2f3f5;
        border-radius: 8px;
        text-decoration: none;
        color: #111;
        font-weight: 500;
        transition: 0.2s;
      }

      a:hover {
        background: #e8e9ec;
      }

      .footer {
        margin-top: 40px;
        font-size: 14px;
        color: #888;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>EverAfter</h1>

      <p>Legal information for the EverAfter mobile application.</p>

      <div class="links">
        <a href="privacy.html"> Privacy Policy </a>

        <a href="terms.html"> Terms of Service </a>
      </div>

      <div class="footer">© 2026 EverAfter</div>
    </div>
  </body>
</html>
